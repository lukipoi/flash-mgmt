<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <!-- DIP-8 正俯视工程图（依据 DIP-8 规格书「一般尺寸」表，单位 INCH ×25.4 转 mm，33.7 px/mm）
       D 0.355–0.400（NOM 9.27mm） E1 0.245–0.255（NOM 6.35） E 0.300（7.62） e 0.100（2.54）
       b1 0.060 NOM（1.52）  b 0.018 NOM（0.46）  L 0.115–0.150（2.92–3.81）
       A ≤0.210（5.33）  A2 0.125–0.135（TYP 3.30）  A1 ≥0.015（0.38）  eA 0.335–0.375（8.51–9.53）  θ 0–15° -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M182 76 V30 M494.4 76 V30"/>
    <path d="M178 80 H46 M178 294 H46"/>
    <path d="M295.35 319.4 V352 M380.95 319.4 V352"/>
    <path d="M496.25 58.6 H556 M496.25 315.4 H556"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M182 36 H494.4" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M52 80 V294" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M295.35 346 H380.95" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M550 58.6 V315.4" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="0.3">
    <text x="338.2" y="26" text-anchor="middle">D 9.27</text>
    <text transform="translate(44 187) rotate(-90)" text-anchor="middle">E1 6.35</text>
    <text x="338.15" y="370" text-anchor="middle">e 2.54</text>
    <text transform="translate(542 187) rotate(-90)" text-anchor="middle">E 7.62</text>
  </g>

  <!-- 引脚：上排 8–5，下排 1–4（缺口示 pin1），肩宽 b1 1.52mm -->
  <g fill="#c3cad6" stroke="#8e97a6" stroke-width="0.8">
    <rect x="184.05" y="58.6" width="51.4" height="21.4" rx="1.5"/>
    <rect x="269.65" y="58.6" width="51.4" height="21.4" rx="1.5"/>
    <rect x="355.25" y="58.6" width="51.4" height="21.4" rx="1.5"/>
    <rect x="440.85" y="58.6" width="51.4" height="21.4" rx="1.5"/>
    <rect x="184.05" y="294" width="51.4" height="21.4" rx="1.5"/>
    <rect x="269.65" y="294" width="51.4" height="21.4" rx="1.5"/>
    <rect x="355.25" y="294" width="51.4" height="21.4" rx="1.5"/>
    <rect x="440.85" y="294" width="51.4" height="21.4" rx="1.5"/>
  </g>

  <!-- 本体 -->
  <rect x="182" y="80" width="312.4" height="214" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>
  <!-- 左侧 pin1 缺口（塑封凹坑，非通孔）：深一档实心半圆，r = 0.157×E1（家族统一） -->
  <path d="M 182 153.3 A 33.7 33.7 0 0 1 182 220.7 Z" fill="#262c38"/>

  <!-- caption -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
    <text x="360" y="396" text-anchor="middle">DIP-8 · 8 脚 · 顶视 Top View · D 9.02–10.16</text>
    <text x="360" y="414" text-anchor="middle">E1 6.22–6.48 · E 7.62 · e 2.54 · b1 1.52（NOM） · b 0.46（NOM）</text>
    <text x="360" y="432" text-anchor="middle">L 2.92–3.81 · A ≤5.33 · A2 3.18–3.43（TYP 3.30） · A1 ≥0.38</text>
    <text x="360" y="450" text-anchor="middle">eA 8.51–9.53（NOM 9.02） · θ 0–15° · 脚1 = 缺口（左）下排最左脚</text>
  </g>
</svg>
