    <rect x="486" y="496" width="12" height="24" rx="6"/>
    <rect x="510" y="496" width="12" height="24" rx="6"/>

    <rect x="150" y="148" width="24" height="12" rx="6"/>
    <rect x="150" y="172" width="24" height="12" rx="6"/>
