    <rect x="546" y="460" width="24" height="12" rx="6"/>
  </g>

  <!-- 参数说明 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
    <text x="360" y="596" text-anchor="middle">56 脚（每边 14 脚）· 底视 Bottom View · D/E 7.00 · D2/E2 4.00 · 缺角 C0.50</text>
    <text x="360" y="614" text-anchor="middle">e 0.40 BSC · b 0.20 · L 0.40 · A 0.85（0.80–0.90）· A1 0–0.05 · A3 0.203 Ref</text>
