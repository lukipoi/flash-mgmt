<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580">
  <!-- QFN-28 4x4 底视图工程图（CH579 数据手册 第 21 章 封装，V2.1）
       D/E 4.0±0.1 · 散热焊盘 D2/E2 2.8±0.1 · e 0.40 · b 0.20±0.05 · L 0.40±0.05 · 厚度默认 0.55
       28 脚 = 每边 7 脚；底视 Pin 1 在右下，用散热焊盘缺角标识，焊盘统一同色 -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwEd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#16202e"/>
    </marker>
    <marker id="arwSd" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#16202e"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M200 130 V62 M520 130 V62"/>
    <path d="M520 130 H616 M520 450 H616"/>
    <path d="M264 450 V470 M296 450 V470"/>
    <path d="M224 346 L164 380"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M200 66 H520" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M610 450 V130" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M264 464 H296" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="0.3">
    <text x="360" y="58" text-anchor="middle">D 4.00</text>
    <text transform="translate(628 290) rotate(-90)" text-anchor="middle">E 4.00</text>
    <text x="280" y="480" text-anchor="middle">e 0.40</text>
    <text x="158" y="384" text-anchor="end">b 0.20</text>
  </g>

  <!-- 本体（底视） -->
  <rect x="200" y="130" width="320" height="320" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>

  <!-- 中心散热焊盘 D2×E2，右下角缺角作 Pin 1 标识 -->
  <path d="M248 178 H472 V374 L444 402 H248 Z" fill="#98a2b3" stroke="#6f7885" stroke-width="1"/>

  <!-- D2 标注画在焊盘内（同数据手册画法，避开下方引脚焊盘） -->
  <path d="M248 290 H472" fill="none" stroke="#16202e" stroke-width="1.2" marker-start="url(#arwSd)" marker-end="url(#arwEd)"/>
  <text x="360" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#16202e" letter-spacing="0.3">D2 2.80</text>

  <!-- 28 个焊盘：焊盘统一同色，仅靠散热焊盘缺角标识 Pin 1 -->
  <g fill="#c3cad6" stroke="#8e97a6" stroke-width="0.8">
    <rect x="256" y="130" width="16" height="32" rx="7"/>
    <rect x="288" y="130" width="16" height="32" rx="7"/>
    <rect x="320" y="130" width="16" height="32" rx="7"/>
    <rect x="352" y="130" width="16" height="32" rx="7"/>
    <rect x="384" y="130" width="16" height="32" rx="7"/>
    <rect x="416" y="130" width="16" height="32" rx="7"/>
    <rect x="448" y="130" width="16" height="32" rx="7"/>

    <rect x="256" y="418" width="16" height="32" rx="7"/>
    <rect x="288" y="418" width="16" height="32" rx="7"/>
    <rect x="320" y="418" width="16" height="32" rx="7"/>
    <rect x="352" y="418" width="16" height="32" rx="7"/>
    <rect x="384" y="418" width="16" height="32" rx="7"/>
    <rect x="416" y="418" width="16" height="32" rx="7"/>
    <rect x="448" y="418" width="16" height="32" rx="7"/>

    <rect x="200" y="186" width="32" height="16" rx="7"/>
    <rect x="200" y="218" width="32" height="16" rx="7"/>
    <rect x="200" y="250" width="32" height="16" rx="7"/>
    <rect x="200" y="282" width="32" height="16" rx="7"/>
    <rect x="200" y="314" width="32" height="16" rx="7"/>
    <rect x="200" y="346" width="32" height="16" rx="7"/>
    <rect x="200" y="378" width="32" height="16" rx="7"/>

    <rect x="488" y="186" width="32" height="16" rx="7"/>
    <rect x="488" y="218" width="32" height="16" rx="7"/>
    <rect x="488" y="250" width="32" height="16" rx="7"/>
    <rect x="488" y="282" width="32" height="16" rx="7"/>
    <rect x="488" y="314" width="32" height="16" rx="7"/>
    <rect x="488" y="346" width="32" height="16" rx="7"/>
    <rect x="488" y="378" width="32" height="16" rx="7"/>
  </g>

  <!-- 参数说明 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
    <text x="360" y="526" text-anchor="middle">28 脚 · 底视 Bottom View · D/E 4.00±0.10 · D2/E2 2.80±0.10</text>
    <text x="360" y="544" text-anchor="middle">e 0.40 · b 0.20±0.05 · L 0.40±0.05 · 厚度 0.55（默认）</text>
  </g>
</svg>
