    <text x="360" y="414" text-anchor="middle">E1 6.25–6.45 · E 7.62–8.25 · e 2.54 · b1 0.38–0.51 · b 0.38–0.55</text>
    <text x="360" y="432" text-anchor="middle">L 2.92–3.81 · A ≤4.80 · A2 3.10–3.50（TYP 3.30） · A1 ≥0.50</text>
    <text x="360" y="450" text-anchor="middle">eB 7.62–10.90 · θ 0–15° · 脚1 = 缺口（左）下排最左脚</text>
  </g>
</svg>
