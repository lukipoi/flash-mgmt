    <rect x="626.94" y="293.2" width="40.64" height="24.32" rx="1.5"/>
  </g>

  <!-- 本体 -->
  <rect x="58" y="90" width="609.6" height="203.2" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>
  <!-- 左侧 pin1 缺口（塑封凹坑，非通孔）：深一档实心半圆 -->
  <path d="M 58 159.6 A 32 32 0 0 1 58 223.6 Z" fill="#262c38"/>

  <!-- caption -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
