  <g fill="#c3cad6" stroke="#8e97a6" stroke-width="0.8">
    <rect x="57.98" y="65.68" width="40.64" height="24.32" rx="1.5"/>
    <rect x="139.26" y="65.68" width="40.64" height="24.32" rx="1.5"/>
