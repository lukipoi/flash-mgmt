<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <!-- DIP-16 正俯视工程图（依据 Microchip PDIP COMMON DIMENSIONS 尺寸表，单位 mm，32 px/mm）
       D 18.95–19.15（NOM 19.05） E1 6.25–6.45（NOM 6.35） E 7.62–8.25（NOM 7.87） e 2.54
       b1 0.38–0.51（NOM 0.46） b 0.38–0.55  L 2.92–3.81（NOM 3.30）
       A ≤4.80  A2 3.10–3.50（TYP 3.30）  A1 ≥0.50  eB 7.62–10.90  θ 0–15° -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M58 86 V30 M667.6 86 V30"/>
    <path d="M54 90 H34 M54 293.2 H34"/>
    <path d="M322.14 321.5 V352 M403.42 321.5 V352"/>
    <path d="M658.6 65.68 H706 M658.6 317.52 H706"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M58 36 H667.6" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M40 90 V293.2" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M322.14 346 H403.42" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M700 65.68 V317.52" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="0.3">
    <text x="362.8" y="26" text-anchor="middle">D 19.05</text>
    <text transform="translate(28 191.6) rotate(-90)" text-anchor="middle">E1 6.35</text>
    <text x="362.8" y="370" text-anchor="middle">e 2.54</text>
    <text transform="translate(692 191.6) rotate(-90)" text-anchor="middle">E 7.87</text>
  </g>

