    <rect x="545.66" y="65.68" width="40.64" height="24.32" rx="1.5"/>
    <rect x="626.94" y="65.68" width="40.64" height="24.32" rx="1.5"/>
    <rect x="57.98" y="293.2" width="40.64" height="24.32" rx="1.5"/>
