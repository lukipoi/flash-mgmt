<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484">
  <!-- WSON-8 6x5（GD25Q32E 规格书 10.5 节）底视图工程图
       依据规格书尺寸表：D 6.00 / E 5.00 / D2 3.40 / E2 4.00 / e 1.27 / b 0.40 / L 0.60，单位 mm
       底视图中 Pin 1 标识为散热焊盘左下角倒角（对应顶视图左上角 PIN 1 圆点） -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M140 130.94 H164 M140 196.98 H164"/>
    <path d="M237.6 334 V402 M414.4 334 V402"/>
    <path d="M170 360 V436 M482 360 V436"/>
    <path d="M414.4 126 H524 M414.4 334 H524"/>
    <path d="M482 100 H558 M482 360 H558"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M140 130.94 V196.98" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M237.6 396 H414.4" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M170 430 H482" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M518 126 V334" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M552 360 V100" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="0.3">
    <text transform="translate(131 164) rotate(-90)" text-anchor="middle">e 1.27</text>
    <text x="326" y="412" text-anchor="middle">D2 3.40</text>
    <text x="326" y="446" text-anchor="middle">D 6.00</text>
    <text transform="translate(529 230) rotate(-90)" text-anchor="middle">E2 4.00</text>
    <text transform="translate(563 230) rotate(-90)" text-anchor="middle">E 5.00</text>
  </g>

  <!-- 本体（底视） -->
  <rect x="170" y="100" width="312" height="260" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>

  <!-- 中心散热焊盘 D2×E2（floating），左下倒角作 Pin 1 标识 -->
  <path d="M261 334 H406.4 A8 8 0 0 0 414.4 326 V134 A8 8 0 0 0 406.4 126 H245.6 A8 8 0 0 0 237.6 134 V310.6 Z"
        fill="#98a2b3" stroke="#6f7885" stroke-width="1"/>

  <!-- 8 个焊盘：无引脚封装靠散热焊盘缺角标识 Pin 1，焊盘统一同色 -->
  <g fill="#c3cad6" stroke="#8e97a6" stroke-width="0.8">
    <rect x="170" y="120.54" width="31.2" height="20.8" rx="7"/>
    <rect x="170" y="186.58" width="31.2" height="20.8" rx="7"/>
    <rect x="170" y="252.62" width="31.2" height="20.8" rx="7"/>
    <rect x="170" y="318.66" width="31.2" height="20.8" rx="7"/>
    <rect x="450.8" y="120.54" width="31.2" height="20.8" rx="7"/>
    <rect x="450.8" y="186.58" width="31.2" height="20.8" rx="7"/>
    <rect x="450.8" y="252.62" width="31.2" height="20.8" rx="7"/>
    <rect x="450.8" y="318.66" width="31.2" height="20.8" rx="7"/>
  </g>

  <!-- 焊盘尺寸说明 -->
  <text x="326" y="468" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">b 0.40 × L 0.60 · 共 8 焊盘</text>
</svg>
