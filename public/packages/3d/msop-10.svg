    <rect x="139.5" y="230.1" width="85.5" height="19.8" rx="3"/>
    <rect x="139.5" y="275.1" width="85.5" height="19.8" rx="3"/>
    <rect x="139.5" y="320.1" width="85.5" height="19.8" rx="3"/>
