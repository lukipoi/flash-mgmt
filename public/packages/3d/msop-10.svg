<svg xmlns="http://www.w3.org/2000/svg" viewBox="130.5 186 459 288" width="459" height="288">
  <!-- MSOP-10 顶视缩略图（无尺寸标注；带标注的工程图见 msop-10-spec.svg）
       CH552 手册 19.4：D 3.0，E1 3.0，E 4.9，e 0.5，b 0.22；顶视 Pin 1 在左上 -->
  <rect x="225" y="195" width="270" height="270" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>

  <!-- Pin 1 标识：本体左上角实心圆点 -->
