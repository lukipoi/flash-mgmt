<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" width="720" height="630">
  <!-- SOP-16 150mil 顶视图工程图（CH552 手册 19.3）
       D 10.0 · E1 3.9 · E 6.0 · e 1.27 · b 0.45 · A 1.55 · A1 0.2 · 脚厚 0.1 · 脚长 0.5
       16 脚 = 8 + 8；顶视 Pin 1 在左上，用本体实心圆点标识 -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M85 222.75 V136 M635 222.75 V136"/>
    <path d="M635 165 H675 M635 495 H675"/>
    <path d="M85 222.75 H55 M85 437.25 H55"/>
    <path d="M115.5 495 V525 M185.35 495 V525"/>
    <path d="M325 475 L352 552"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M85 140 H635" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M669 495 V165" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M61 437.25 V222.75" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M115.5 519 H185.35" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#67e8f9" letter-spacing="0.3">
    <text x="360" y="132" text-anchor="middle">D 10.0</text>
    <text transform="translate(689 330) rotate(-90)" text-anchor="middle">E 6.00</text>
    <text transform="translate(43 330) rotate(-90)" text-anchor="middle">E1 3.90</text>
    <text x="150" y="540" text-anchor="middle">e 1.27</text>
    <text x="358" y="556">b 0.45</text>
  </g>

  <!-- 本体（顶视） -->
  <rect x="85" y="222.75" width="550" height="214.5" rx="3" fill="#2f3542" stroke="#0b0f16" stroke-width="1.5"/>

  <!-- Pin 1 标识：本体左上角实心圆点 -->
  <circle cx="110" cy="250" r="12" fill="#d9d9d9"/>

  <!-- 16 只鸥翼引脚：8 上 + 8 下，间距 1.27mm，向外伸出 E-E1 的一半 -->
  <g fill="#c3cad6" stroke="#8e97a6" stroke-width="0.8">
    <rect x="103.125" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="172.975" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="242.825" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="312.675" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="382.525" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="452.375" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="522.225" y="165" width="24.75" height="57.75" rx="3"/>
    <rect x="592.075" y="165" width="24.75" height="57.75" rx="3"/>

    <rect x="103.125" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="172.975" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="242.825" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="312.675" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="382.525" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="452.375" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="522.225" y="437.25" width="24.75" height="57.75" rx="3"/>
    <rect x="592.075" y="437.25" width="24.75" height="57.75" rx="3"/>
  </g>

  <!-- 参数说明 -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
    <text x="360" y="590" text-anchor="middle">16 脚（8 + 8）· 顶视 Top View · D 10.0 · E1 3.90 · E 6.00 · e 1.27</text>
    <text x="360" y="608" text-anchor="middle">b 0.45 · A 1.55 · A1 0.2 · 脚厚 0.1 · 脚长 0.5</text>
  </g>
</svg>
