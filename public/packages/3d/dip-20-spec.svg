<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <!-- DIP-20 正俯视工程图（依据 DIP-20 规格书「一般尺寸」表，单位 INCH ×25.4 转 mm，22 px/mm）
       D 1.012–1.040（NOM 26.06mm） E1 0.245–0.255（6.35） E 0.290–0.310（7.62） e 0.090–0.110（2.54）
       b1 0.058–0.064（1.52）  b 0.016–0.020（0.46）  C 0.008–0.011（0.25）  L 0.120–0.140（3.05–3.56）
       A ≤0.175（4.45）  A2 0.125–0.135（TYP 3.30）  A1 ≥0.015（0.38）  eA 0.355（9.02）  S ≤0.075（1.91）  θ 0–15° -->
  <defs>
    <marker id="arwE" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arwS" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7 1 L1 4 L7 7 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M76 76 V30 M649.3 76 V30"/>
    <path d="M72 80 H40 M72 219.7 H40"/>
    <path d="M334.72 237.7 V272 M390.6 237.7 V272"/>
    <path d="M665.3 66 H690 M665.3 233.7 H690"/>
  </g>

  <!-- 尺寸线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2">
    <path d="M76 36 H649.3" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M48 80 V219.7" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M334.72 266 H390.6" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
    <path d="M684 66 V233.7" marker-start="url(#arwS)" marker-end="url(#arwE)"/>
  </g>

  <!-- 尺寸标注 -->
