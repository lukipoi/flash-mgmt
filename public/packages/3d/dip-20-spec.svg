    <text transform="translate(40 149.85) rotate(-90)" text-anchor="middle">E1 6.35</text>
    <text x="362.66" y="290" text-anchor="middle">e 2.54</text>
    <text transform="translate(676 149.85) rotate(-90)" text-anchor="middle">E 7.62</text>
  </g>

