  <!-- caption -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.3">
    <text x="360" y="396" text-anchor="middle">DIP-20 · 20 脚 · 顶视 Top View · D 25.70–26.42</text>
    <text x="360" y="414" text-anchor="middle">E1 6.22–6.48 · E 7.37–7.87 · e 2.29–2.79 · b1 1.47–1.63 · b 0.41–0.51</text>
    <text x="360" y="432" text-anchor="middle">L 3.05–3.56 · A ≤4.45 · A2 3.18–3.43（TYP 3.30） · A1 ≥0.38 · C 0.20–0.28</text>
