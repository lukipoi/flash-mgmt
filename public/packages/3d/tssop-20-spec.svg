    </marker>
  </defs>

  <!-- 尺寸辅助线 -->
  <g fill="none" stroke="#22d3ee" stroke-width="0.9" stroke-opacity="0.55">
    <path d="M191 120 V52 M529 120 V52"/>
    <path d="M581 68 H634 M581 400.8 H634"/>
    <path d="M139 120 H154 M139 348.8 H154"/>
    <path d="M207.9 400.8 V436 M241.7 400.8 V436"/>
