<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <!-- TSSOP-20 正俯视工程图（HC32L110C6PA 数据手册 TSSOP20 封装页）
       依据规格书尺寸表：D 6.50 / E 6.40 / E1 4.40 / e 0.65 / b 0.20~0.28 / L 0.60，单位 mm -->
